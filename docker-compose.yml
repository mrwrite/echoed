services:
  migrate:
    build: ./backend
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-echoed}
      ALLOWED_HOSTS: backend,localhost,127.0.0.1,testserver
    command: ["bash", "./migrate.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-echoed}
      STORYBOOK_PATH: /data/storybook
      COLORINGS_PATH: /data/colorings
      BADGES_PATH: /data/badges
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      ALLOWED_HOSTS: backend,localhost,127.0.0.1,testserver
      AUTO_MIGRATE_ON_STARTUP: "false"
    volumes:
      - ./backend/storybook:/data/storybook
      - ./backend/colorings:/data/colorings
      - ./backend/badges:/data/badges
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-echoed}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-echoed}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  postgres_data:
  minio_data:
